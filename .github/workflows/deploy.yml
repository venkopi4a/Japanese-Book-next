name: Publish

# Builds the app and publishes it to GitHub Pages whenever the main branch changes.
# If any test fails, nothing is published.
#
# The finished app is pushed to the gh-pages branch, and GitHub Pages serves that branch
# (Settings > Pages > Source: "Deploy from a branch", gh-pages, / (root)).
# This replaced the upload-pages-artifact / deploy-pages actions on 2026-11-25: GitHub's artifact
# service kept reporting "No artifacts named github-pages were found" right after a successful upload
# (Publish #18-#20, also after updating to deploy-pages v5), so nothing went live.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - name: Publish the built app to the gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          touch .nojekyll   # serve every file as it is (no Jekyll processing)
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Published $(git rev-parse --short HEAD) to gh-pages"
      - name: Make sure GitHub Pages serves the gh-pages branch
        continue-on-error: true   # if GitHub refuses, set it once by hand: Settings > Pages > Deploy from a branch > gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          auth=(-H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          curl -sS "${auth[@]}" "$api" | grep -E '"(build_type|status|html_url)"|"branch"' || true
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -X PUT "${auth[@]}" "$api" -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}')
          echo "Switch Pages source to gh-pages: HTTP $code"; cat /tmp/pages.json; echo
          [ "$code" = "204" ] || [ "$code" = "200" ]
